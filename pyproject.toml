[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "conlens"
version = "1.0.0"
description = "Transparent ranked enrichment and leading-edge networks for connectome-wide data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "conlens contributors"}]
keywords = ["connectome", "enrichment", "neuroimaging", "network neuroscience"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "networkx>=3.0",
  "matplotlib>=3.7",
  "joblib>=1.3",
]

[project.optional-dependencies]
nilearn = ["nilearn>=0.10"]
docs = ["mkdocs>=1.5", "mkdocstrings[python]>=0.24"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5", "mypy>=1.8", "build>=1.0", "twine>=5.0"]

[project.scripts]
conlens = "conlens.cli:main"

[project.urls]
Documentation = "https://zh1peng.github.io/conlens/"
Repository = "https://github.com/zh1peng/conlens"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["conlens"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
